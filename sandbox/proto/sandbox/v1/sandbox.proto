syntax = "proto3";

// 基盤の機能を1つずつ試す RPC。業務の例はガチャ(gacha.proto)にある。
package sandbox.v1;

import "sandbox/v1/badge.proto";
import "sandbox/v1/notification.proto";
import "sandbox/v1/player.proto";

option csharp_namespace = "Sandbox.V1";

service SandboxService {
  // 認証付きの疎通。サーバー時刻・日付のヘッダーと、共通レスポンス項目の形を確かめる。
  // プレイヤーがまだ作られていなければ FAILED_PRECONDITION + PLAYER_NOT_FOUND を返す。
  rpc Ping(PingRequest) returns (PingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 指定したエラーコード(sandbox の業務エラーか基盤の予約エラー)で失敗する。action によるエラー処理を確かめる。
  rpc Fail(FailRequest) returns (FailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // カウンターに amount を足す。冪等性の対象なので、同じ RequestID で2回呼んでも1回だけ足される。
  // プレイヤーがまだ作られていなければ FAILED_PRECONDITION + PLAYER_NOT_FOUND を返す。
  rpc Increment(IncrementRequest) returns (IncrementResponse);
}

message PingRequest {}

message PingResponse {
  // ULID(26文字)
  string player_id = 1;
  // 規約: 共通レスポンス項目。Ping ではカウンターの現在値を返す
  PlayerDiff player_diff = 2;
  // 規約: 共通レスポンス項目。Ping ではカウンターのバッジを返す
  repeated Badge badges = 3;
  // 規約: 共通レスポンス項目。Ping では疎通できたことを通知する
  repeated Notification notifications = 4;
}

message FailRequest {
  // 失敗させるエラーコードの domain(sandbox か voltech)
  string domain = 1;
  // 失敗させるエラーコードの reason。空なら INTERNAL_ERROR(voltech)で失敗する。知らないコードなら INVALID_ARGUMENT
  string reason = 2;
}

message FailResponse {}

message IncrementRequest {
  // 足す数
  int64 amount = 1;
}

message IncrementResponse {
  // 足した後のカウンター
  int64 counter = 1;
  // 規約: 共通レスポンス項目
  PlayerDiff player_diff = 2;
}
