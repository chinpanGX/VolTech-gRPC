# 基盤の .proto(voltech.v1)→ UPM パッケージの C#。Rust は各クレートの build.rs で生成する。
# sandbox の .proto は buf.gen.sandbox.yaml で sandbox の Unity プロジェクトに出す。
# 通信するときに見るファイルを探しやすいように、生成するものの種類でフォルダを分ける
# (Messages: リクエスト・レスポンスの型、Grpc: gRPC クライアント)。
# 基盤のデバイス登録(voltech.v1)は Auth が直接呼ぶので、ラッパーは生成しない。
# Unity では Grpc.Tools が動かないので、生成した C# はコミットする。
version: v2
# clean は使わない。生成のたびに .meta まで消えて GUID が変わり、差分が出るため。
# .proto を消したときは、生成済みの .cs と .meta を手で消す
plugins:
  # protoc 組み込みの C# 生成: メッセージ型
  - protoc_builtin: csharp
    out: Unity/com.chinpangx.voltech.grpc/Runtime/Generated/Messages
    opt:
      - base_namespace=
  # grpc_csharp_plugin: gRPC クライアント(make proto-tools が .tools/bin に入れる)
  - local: grpc_csharp_plugin
    out: Unity/com.chinpangx.voltech.grpc/Runtime/Generated/Grpc
    opt:
      - no_server
      - base_namespace=
