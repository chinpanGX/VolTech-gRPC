[workspace]
resolver = "3"
members = ["auth", "error", "status", "transaction"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
voltech-grpc-auth = { path = "auth" }
voltech-grpc-error = { path = "error" }
voltech-grpc-status = { path = "status" }
voltech-grpc-transaction = { path = "transaction" }

argon2 = "0.6"
http = "1"
jiff = "0.2"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-types = "0.14"
tower = "0.5"
tracing = "0.1"
ulid = "3"
