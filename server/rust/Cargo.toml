[workspace]
resolver = "3"
members = [
    # アプリごとに変更しないもの。app/ には依存しない
    "framework/auth",
    "framework/error",
    "framework/status",
    "framework/transaction",
    # アプリごとに変更するもの
    "app/proto",
    "app/player",
    "app/gacha",
    "app/api",
    "app/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
voltech-grpc-auth = { path = "framework/auth" }
voltech-grpc-error = { path = "framework/error" }
voltech-grpc-status = { path = "framework/status" }
voltech-grpc-transaction = { path = "framework/transaction" }

proto = { path = "app/proto" }
player = { path = "app/player" }
gacha = { path = "app/gacha" }
api = { path = "app/api" }

argon2 = "0.6"
dotenvy = "0.15"
http = "1"
jiff = "0.2"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
