# 開発用の MySQL(設計書 6.3: cargo test の結合テストと、sandbox のサーバーで使う)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Tokyo
    ports:
      # 3306 は他のプロジェクト(Atlas など)と重なりやすいので避ける
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # sandbox のサーバー用の DB(voltech_sandbox)を作る
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
